[project]
name = "saos"
version = "0.1.0"
description = "由 agent 驱动 Zemax OpticStudio 的光学设计工作流"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "optiland==0.6.3",
    "torch>=2.2",
    "numba>=0.60",
    "pythonnet==3.0.5",
    "pyyaml>=6.0.3",
    "scipy>=1.13",
]

[project.scripts]
saos = "saos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "zemax: 需要本机真实 OpticStudio，默认跳过；设置 SAOS_RUN_ZEMAX=1 后运行",
]
