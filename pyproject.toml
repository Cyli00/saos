[project]
name = "saos"
version = "0.1.0"
description = "由 agent 驱动 Zemax OpticStudio 的光学设计工作流"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "pythonnet==3.0.5",
    "pyyaml>=6.0.3",
    "rtc",
    "scipy>=1.13",
]

[tool.uv.sources]
# rtc（ray tracing core）与 saos 并列存放；编辑安装，保证 saos 跑的就是 rtc 回归（tools/compare_golden.py）验证过的那份代码
rtc = { path = "../rtc", editable = true }

[project.scripts]
saos = "saos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "zemax: 需要本机真实 OpticStudio，默认跳过；设置 SAOS_RUN_ZEMAX=1 后运行",
]
