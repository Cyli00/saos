# sources/demand.yaml — copy this file and fill it in. Only the fields below are accepted.
# ids: [A-Za-z][A-Za-z0-9_]*, unique across sections.
#
# Every limit needs a source: user | a datasheet, paper or textbook table | "agent assumption: <why>".
# Only constants, variables and objectives are judged and versioned: anything that affects the design
# or its acceptance belongs there, never only in summary. Changing a value, range, check, weight, unit,
# origin, source or stop needs a new confirmation; changing a description, the summary, the questions
# or lang does not, and keeps earlier rounds comparable.
# Bounds: {max: v} or {min: v} (min <= max), or {equals: v, tol: t} (t > 0). scale normalises a gap:
# default tol for equals, else |bound|; required when the bound is 0 and on minimize/maximize without
# must. ideal is the best reachable value: default 0 for minimize, required for maximize.
# Weights: origin user defaults to 1, agent to 0.3; an agent objective never outweighs the lightest user
# one; weight overrides only a bounded or directional objective.
# check is exactly one of {operand: {type, int1, int2, data}}, {analysis: {type, settings, path}} or
# {script: checks/<file>.py}; a script defines run(ctx) and returns one number (inf when a precondition
# fails). "As small as possible" is minimize, never must: {max: 0} (refused). An unknown real-world fact
# is an open_question, never a variable.

schema: 2

constants:                          # fixed conditions the design must not change
  - id: wavelengths
    description: excitation / emission reference
    value: 488 / 532
    unit: nm
    source: user 2026-10-14
  - id: efl
    description: effective focal length kept from the sample
    check: {operand: {type: EFFL}}
    goal: {equals: 50.0, tol: 0.5}
    source: user

variables:                          # freedoms you may use; a range needs a check
  - id: lens_index
    description: nd of every printed lens
    range: {max: 1.6}
    check: {script: checks/lens_index.py}
    scale: 0.05
    source: resin datasheet (sources/resin.pdf)
  - id: surfaces
    description: surface forms of lens 1 and lens 2
    options: [freeform, flat-based Fresnel]

objectives:                         # measured goals, one quantity per entry
  - id: spot
    description: 532 nm RMS spot diameter (um), worst required field
    check: {script: checks/spot.py}
    origin: user
    must: {max: 3.7}
    minimize: true
    wish: {max: 1.5}
    weight: 2.0
    source: user 2026-10-14 (one camera pixel)
  - id: pass_rate
    description: worst-field share of rays reaching the sample (%)
    check: {script: checks/pass_rate.py}
    origin: agent
    must: {min: 90.0}
    scale: 10.0
    source: "agent assumption: below 90 % the signal drops noticeably"

structure: {mode: free}             # free | prescribed (prescribed also needs a reason)

open_questions:
  - {question: "Which brain region? It sets the scattering length.", blocking: false}

summary: |
  Two to six sentences: why this design exists, what changed during the interview,
  what is agreed now, and what is still open.

# stop: {rel: 0.01, max_rounds: 30, tiers: [local, variables, materials, global, structure]}
lang: zh
