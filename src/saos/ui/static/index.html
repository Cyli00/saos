<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>saos</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><span class="logo"></span><div><b>saos</b><span class="job" id="job-name"></span></div></div>
      <div class="title" id="job-title"></div>
      <svg id="arc" aria-label="workflow"></svg>
      <div class="status">
        <span class="pill metric" id="metric-chip" hidden></span>
        <span class="pill run" id="run-chip" hidden><span class="led"></span><span id="run-text"></span></span>
        <span class="pill" id="mode-chip"></span>
      </div>
    </header>
    <main class="main">
      <div class="col">
        <section class="card lens" id="c-lens">
          <div class="hd"><b id="lens-title"></b><span class="seg" id="dim-seg"><button data-dim="2d">2D</button><button data-dim="3d" class="on">3D</button></span><span class="src" id="lens-src"></span></div>
          <div class="lens-body" id="lens"></div>
        </section>
        <section class="card ld" id="c-ld">
          <div class="hd" id="ld-hd"><b id="ld-title"></b><span class="src" id="ld-note"></span><button class="icon" id="ld-toggle" aria-expanded="true" aria-label="toggle Lens Data">▾</button></div>
          <div class="ld-body" id="ld"></div>
        </section>
      </div>
      <div class="col side">
        <div class="notice" id="notice" hidden><span id="notice-text"></span><button id="notice-close"></button></div>
        <section class="card notes" id="notes" hidden></section>
        <section class="card gate" id="gate" hidden></section>
        <div class="row judge-row">
          <section class="card judge" id="c-judge">
            <div class="hd"><b id="judge-title"></b><span class="src" id="judge-src"></span><button class="icon" id="pick-open" aria-label="add">＋</button></div>
            <div class="gauges" id="gauges"></div>
          </section>
          <section class="card need" id="c-need">
            <div class="hd"><b id="need-name"></b><span class="rule" id="need-rule"></span><span class="seg" id="need-mode" hidden></span></div>
            <div class="need-body" id="need"></div>
          </section>
        </div>
        <div class="row ana-row">
          <section class="card ana" id="c-ana-0">
            <div class="hd"><div class="tabs" id="tabs-0" role="tablist"></div><button class="icon" id="expand-0" aria-label="expand">⤢</button></div>
            <div class="pane" id="view-0"></div>
          </section>
          <section class="card ana" id="c-ana-1" hidden>
            <div class="hd"><div class="tabs" id="tabs-1" role="tablist"></div><button class="icon" id="expand-1" aria-label="expand">⤢</button></div>
            <div class="pane" id="view-1"></div>
          </section>
        </div>
      </div>
    </main>

    <footer class="timeline">
      <div class="lab"><b id="tl-title"></b><span id="tl-hint"></span></div>
      <div class="track" id="track"><div class="rail"><i id="rail-fill"></i></div><div id="ticks"></div><div class="knob" id="knob" hidden></div></div>
      <div class="readk"><b class="num" id="k-pos">—</b><span id="k-state"></span></div>
    </footer>
  </div>

  <div class="zoom" id="zoom" hidden>
    <section class="card">
      <div class="hd"><b id="zoom-title"></b><button class="icon" id="zoom-close" aria-label="close">✕</button></div>
      <div class="pane wide" id="zoom-view"></div>
    </section>
  </div>
  <div class="zoom" id="picker" hidden>
    <section class="card picker">
      <div class="hd"><b id="picker-title"></b><button class="gbtn primary" id="picker-save"></button><button class="icon" id="picker-close" aria-label="close">✕</button></div>
      <div class="pane wide" id="picker-body"></div>
    </section>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
